# This workflow will install Python dependencies and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Components CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [sensor, edge, common]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5 # Päivitetty v5 (luotettavampi polkujen kanssa)
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        cd ${{ matrix.component }}
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests
      env:
        # Pidetään PYTHONPATH vain testattavassa komponentissa ja juuritasolla moduulihakuja varten
        PYTHONPATH: ${{ github.workspace }}
      run: |
        cd ${{ matrix.component }}
        if [ -d "tests" ]; then
          echo "Folder tests/ found for component ${{ matrix.component }}. Running tests..."
          pytest ./tests
        else
          echo "Component ${{ matrix.component }} has no tests."
        fi

  integration-test:
    needs: unit-tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        for dir in sensor edge common; do
          if [ -f $dir/requirements.txt ]; then pip install -r $dir/requirements.txt; fi
        done

    - name: Run E2E Integration Tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        if ls tests/test_*.py 1> /dev/null 2>&1; then
          pytest tests/
        else
          echo "No integration tests found in juuri/tests/. Skipping."
        fi
