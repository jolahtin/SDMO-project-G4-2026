# This workflow will install Python dependencies and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Components CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [sensor, edge, common]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest
    - name: Run unit tests
      env:
        PYTHONPATH: ${{ github.workspace }}/${{ matrix.component }}
      run: |
        cd ${{ matrix.component }}
        pytest

  integration-test:
    needs: unit-tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install all dependencies
      run: |
        pip install pytest
        for dir in sensor edge cloud_storage; do
          if [ -f $dir/requirements.txt ]; then pip install -r $dir/requirements.txt; fi
        done

    - name: Run E2E Integration Tests
      env:
        PYTHONPATH: .  # Asettaa juurikansion polkuun, jotta testit voivat importata kaikista kansioista
      run: |
        pytest tests/

        
